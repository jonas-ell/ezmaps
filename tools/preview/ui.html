<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rye&family=Press+Start+2P&family=VT323&display=block" rel="stylesheet">
<style>
  /* Pricedown nur lokal (Desktop-Lizenz). Für die App ist eine App-Lizenz nötig. */
  @font-face { font-family: 'Pricedown'; src: url('fonts/pricedown.otf') format('opentype'); }
  /* iPhone 16: 393 × 852 pt @3x. 1 pt = 3 px. Alle Maße unten in px. */
  :root { --pt: 3px; }
  .t-neon    { --accent: #a13df0; --accent2: #d9ad3a; --ok: #58b05f; --panel: rgba(0,0,0,0.80); --panel2: rgba(0,0,0,0.62); --fg: #fff; --muted: #a9a9ad; --selbg: #fff; --selfg: #000; --head: Pricedown; --body: Inter; --edge: none; --status: #fff; --line: rgba(255,255,255,0.12); --hs: 1; }
  .t-western { --accent: #c0261f; --accent2: #b8862b; --ok: #c0261f; --panel: #efe2c0; --panel2: rgba(239,226,192,0.92); --fg: #2e1e10; --muted: #6b5236; --selbg: #2e1e10; --selfg: #f2e4bf; --head: Rye; --body: Inter; --edge: 6px double #4a3220; --status: #2e1e10; --line: rgba(74,50,32,0.25); --hs: 0.62; }
  .t-pixel   { --accent: #ffcc33; --accent2: #ff6b3d; --ok: #ffcc33; --panel: #1a2a6c; --panel2: #1a2a6c; --fg: #fff; --muted: #b8c4ff; --selbg: #ffcc33; --selfg: #1a1a1a; --head: 'Press Start 2P'; --body: VT323; --edge: 6px solid #fff; --status: #fff; --line: rgba(255,255,255,0.2); --hs: 0.5; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #111; font-family: Inter, sans-serif; }
  .screen { position: relative; overflow: hidden; color: var(--fg); background: #3d3e40 center/cover no-repeat; font-family: var(--body); }
  .phone { width: 1179px; height: 2556px; }
  .car { width: 1920px; height: 720px; display: flex; color: #fff; }
  .abs { position: absolute; }
  .row { display: flex; align-items: center; }
  .head { font-family: var(--head); font-weight: 400; line-height: 1; }
  .t-neon .head { text-shadow: 0 0 1px #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000, 0 5px 0 #000, 0 -5px 0 #000, 5px 0 0 #000, -5px 0 0 #000; }
  .t-pixel .head { text-shadow: 6px 6px 0 #000; }
  .panel { background: var(--panel); border: var(--edge); }
  .t-pixel .panel { box-shadow: inset 0 0 0 6px #0d1640, 0 0 0 6px #000; border-radius: 6px; }
  .t-western .panel { box-shadow: 0 8px 24px rgba(60,35,15,0.35); }
  .upper { text-transform: uppercase; letter-spacing: 0.04em; }
  .t-pixel .body-l { font-size: 1.35em; }
  svg.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  canvas.pix { image-rendering: pixelated; flex: none; }

  /* --- iOS-Systemteile (Status, Insel, Home-Indikator) --- */
  .status { position: absolute; top: 0; left: 0; right: 0; height: 177px; z-index: 50; color: var(--status); pointer-events: none; }
  .status .time { position: absolute; left: 0; width: 400px; top: 60px; text-align: center; font: 600 51px Inter; letter-spacing: -0.5px; }
  .status .icons { position: absolute; left: 779px; right: 0; top: 70px; display: flex; justify-content: center; gap: 18px; align-items: center; }
  .island { position: absolute; left: 400px; top: 33px; width: 378px; height: 112px; border-radius: 56px; background: #000; z-index: 60; }
  .homebar { position: absolute; left: 388px; top: 2517px; width: 402px; height: 15px; border-radius: 8px; background: var(--status); z-index: 60; }

  /* Spiel-Menüliste */
  .menu .item { display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 0 44px; min-height: 150px; font: 600 48px var(--body); border-bottom: 2px solid var(--line); }
  .t-pixel .menu .item { font-size: 60px; }
  .menu .item.sel { background: var(--selbg); color: var(--selfg); }
  .menu .item small { display: block; font: 500 36px var(--body); color: var(--muted); margin-top: 6px; }
  .t-pixel .menu .item small { font-size: 46px; }
  .menu .item.sel small { color: inherit; opacity: 0.7; }
  .menu .title { background: var(--accent); color: #fff; height: 120px; padding: 0 44px; display: flex; align-items: center; font-size: 72px; }
  .t-pixel .menu .title { color: #1a1a1a; font-size: 42px; }

  /* Tab-Leiste: 49 pt + 34 pt Home-Bereich */
  .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 249px; background: var(--panel); border-top: var(--edge); display: flex; justify-content: space-around; padding-top: 20px; font: 600 30px var(--body); }
  .tabs div { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); width: 220px; font-size: 30px; }
  .t-pixel .tabs div { font-size: 40px; }
  .tabs div.on { color: var(--fg); } .tabs div.on .ic, .tabs div.on canvas { color: var(--accent); }
  .tabs .ic { font-size: 78px; }

  .bar { height: 26px; background: rgba(0,0,0,0.35); outline: 5px solid rgba(0,0,0,0.6); } .bar i { display: block; height: 100%; }
  .btn { display: grid; place-items: center; }
  .chip { height: 104px; padding: 0 24px; gap: 14px; font: 600 36px var(--body); }
  .t-pixel .chip { font-size: 52px; }

  /* CarPlay */
  .dock { width: 140px; background: #000; display: flex; flex-direction: column; align-items: center; padding: 26px 0; gap: 26px; font: 600 30px Inter; flex: none; }
  .dock .app { width: 96px; height: 96px; border-radius: 22px; }
  .carmain { position: relative; flex: 1; background: #3d3e40 center/cover no-repeat; overflow: hidden; }
  .sys { background: rgba(28,28,30,0.94); border-radius: 22px; color: #fff; font-family: Inter; }
  .sysbtn { background: rgba(28,28,30,0.88); border-radius: 22px; display: grid; place-items: center; font: 600 34px Inter; color: #fff; }
  .navbar { position: absolute; top: 0; left: 0; right: 0; height: 86px; display: flex; justify-content: space-between; padding: 14px 20px; }
  .navbar div { display: flex; gap: 14px; } .navbar span { background: rgba(28,28,30,0.9); border-radius: 18px; padding: 0 26px; display: flex; gap: 12px; align-items: center; font: 600 30px Inter; height: 60px; color: #fff; }
  .tag { position: absolute; font: 600 18px Inter; color: #ffd23f; background: rgba(0,0,0,0.65); padding: 4px 10px; border-radius: 6px; z-index: 70; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
const screen = P.get('screen');
const theme = screen.includes('western') ? 'western' : screen.includes('pixel') ? 'pixel' : 'neon';

// ------------------------------------------------------------ Platzhalter-Icons (werden durch Codex-Assets ersetzt)
const I = {
  search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/>',
  home: '<path d="M3 11 12 4l9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>',
  work: '<rect x="3" y="7.5" width="18" height="12" rx="2"/><path d="M9 7.5V5h6v2.5M3 12.5h18"/>',
  fuel: '<path d="M5 20V5.5A1.5 1.5 0 0 1 6.5 4h6A1.5 1.5 0 0 1 14 5.5V20M3.5 20h12M5 10h9"/><path d="M14 8.5l3.5 2.5v6a1.5 1.5 0 0 0 3 0V8l-2.5-2.5"/>',
  parking: '<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M9.5 17V7.5h3.5a2.75 2.75 0 0 1 0 5.5H9.5"/>',
  layers: '<path d="m12 3.5 9 4.75-9 4.75-9-4.75z"/><path d="m3 12.5 9 4.75 9-4.75"/><path d="m3 16.5 9 4.75 9-4.75" opacity=".5"/>',
  friends: '<circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9.5" r="2.6"/><path d="M16.5 14.2A5.4 5.4 0 0 1 22 19.5"/>',
  locate: '<path d="M20.5 3.5 3.5 11l7 2.5 2.5 7z"/>',
  map: '<path d="M9 4.5 3.5 6.5v13l5.5-2 6 2 5.5-2v-13l-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/>',
  explore: '<circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
  style: '<path d="M12 3.5 20 12l-8 8.5L4 12z"/><path d="M12 3.5v17M4 12h16" opacity=".55"/>',
  profile: '<circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
  reroute: '<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  volume: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
  share: '<path d="M12 14V3.5M8 7l4-3.5L16 7"/><path d="M6 11v8.5h12V11"/>',
  chevron: '<path d="m9.5 5.5 6.5 6.5-6.5 6.5"/>', back: '<path d="m14.5 5.5-6.5 6.5 6.5 6.5"/>',
  more: '<circle cx="5.5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18.5" cy="12" r="1.3" fill="currentColor"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>',
  clip: '<rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="m10 9.5 5 2.5-5 2.5z" fill="currentColor"/>',
  food: '<path d="M7 3.5v17M4.5 3.5v5a2.5 2.5 0 0 0 5 0v-5M17 20.5V3.5c-2.5 1-3.5 4-3.5 7.5h3.5"/>',
  star: '<path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/>',
  turnLeft: '<path d="M15 21V12a4 4 0 0 0-4-4H5"/><path d="m9 4-4 4 4 4"/>',
  turnRight: '<path d="M9 21V12a4 4 0 0 1 4-4h6"/><path d="m15 4 4 4-4 4"/>',
  signal: 'SIGNAL', wifi: 'WIFI',
};
const ic = (name, size, extra = '') => `<svg class="ic" viewBox="0 0 24 24" style="font-size:${size}px;${extra}" data-ic="${name}">${I[name]}</svg>`;
// Pixel-Stil: Icons werden auf 16×16 gerastert und hart hochskaliert
async function pixelize() {
  for (const el of [...document.querySelectorAll('svg.ic')].filter(e => !e.closest('.sys,.sysbtn,.dock'))) {
    const size = parseFloat(el.style.fontSize) || 48;
    const color = getComputedStyle(el).color;
    const src = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter">${el.innerHTML.replaceAll('currentColor', color)}</svg>`;
    const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src); await img.decode();
    const c = document.createElement('canvas'); c.width = c.height = 16; const g = c.getContext('2d'); g.drawImage(img, 0, 0, 16, 16);
    const d = g.getImageData(0, 0, 16, 16); for (let i = 3; i < d.data.length; i += 4) d.data[i] = d.data[i] > 90 ? 255 : 0; g.putImageData(d, 0, 0);
    c.className = 'pix'; c.style.width = c.style.height = Math.round(size / 16) * 16 + 'px';
    el.replaceWith(c);
  }
}

// iOS-Statusleiste
const statusBar = () => `<div class="island"></div><div class="status"><div class="time">16:48</div><div class="icons">
  <svg width="54" height="36" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx=".7"/><rect x="5" y="5.5" width="3" height="6.5" rx=".7"/><rect x="10" y="3" width="3" height="9" rx=".7"/><rect x="15" y="0" width="3" height="12" rx=".7"/></svg>
  <svg width="50" height="36" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.3A10.8 10.8 0 0 0 8.5.5 10.8 10.8 0 0 0 1 3.5l1.2 1.3a9 9 0 0 1 6.3-2.5z"/><path d="M8.5 5.8c1.5 0 2.8.5 3.8 1.5l1.2-1.3a7.3 7.3 0 0 0-10 0l1.2 1.3c1-1 2.3-1.5 3.8-1.5z"/><path d="M8.5 9.2c.6 0 1.1.2 1.5.6L8.5 11.5 7 9.8c.4-.4.9-.6 1.5-.6z"/></svg>
  <svg width="82" height="39" viewBox="0 0 27.3 13"><rect x=".5" y=".5" width="24" height="12" rx="3.8" fill="none" stroke="currentColor" stroke-opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2.3" fill="currentColor"/><path d="M25.8 4.5v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" fill-opacity=".4"/></svg>
  </div></div><div class="homebar"></div>`;
const bg = n => `url('out/bg-${n}.png')`;
const tabs = on => `<div class="tabs">${[['map', 'Karte'], ['explore', 'Entdecken'], ['style', 'Stile'], ['profile', 'Profil']].map(([i, t]) => `<div class="${t === on ? 'on' : ''}">${ic(i, 78)}${t}</div>`).join('')}</div>`;
const roundBtn = (i, s = 140) => `<div class="panel btn" style="width:${s}px;height:${s}px;border-radius:${theme === 'neon' ? 0 : 12}px">${ic(i, s * 0.45)}</div>`;

// Navigation (iPhone) – gemeinsam für alle Stile
function phoneNav() {
  const dist = '230 m', street = 'Limburger Straße', cur = 'Wiesbadener Straße';
  const headSize = theme === 'pixel' ? 92 : theme === 'western' ? 108 : 150;
  return `<div class="screen phone t-${theme}" style="background-image:${bg('phone-nav-' + theme)}">${statusBar()}
    <div class="abs panel row" style="top:177px;left:48px;right:48px;height:330px;padding:0 50px;gap:50px;border-left:${theme === 'neon' ? '18px solid var(--accent)' : ''}">
      <div style="color:${theme === 'western' ? 'var(--accent)' : 'var(--fg)'}">${ic('turnLeft', 200, 'stroke-width:2.8')}</div>
      <div><div class="head" style="font-size:${headSize}px">${dist}</div>
        <div class="upper body-l" style="font:700 52px var(--body);margin-top:${theme === 'pixel' ? 34 : 20}px;color:var(--muted)">${street}</div></div></div>
    <div class="abs" style="top:540px;right:48px;width:190px;height:190px;border-radius:50%;background:#fff;border:22px solid #e3001b;display:grid;place-items:center;font:800 78px Inter;color:#111">50</div>
    <div class="abs" style="top:540px;left:48px;display:flex;flex-direction:column;gap:24px">${roundBtn('volume')}${roundBtn('clip')}</div>
    <div class="abs" style="left:48px;bottom:470px">
      <div class="panel upper" style="display:inline-block;padding:16px 30px;font:700 44px var(--body)"><span class="body-l">${cur}</span></div>
      <div class="row" style="margin-top:26px;gap:16px"><span class="head" style="font-size:${headSize * 0.62}px">↑ ${dist}</span></div>
      <div class="row" style="gap:12px;margin-top:22px"><div class="bar" style="width:380px"><i style="width:38%;background:var(--ok)"></i></div><div class="bar" style="width:200px"><i style="width:70%;background:var(--accent2)"></i></div></div>
    </div>
    <div class="abs panel" style="left:0;right:0;bottom:0;height:400px;padding:44px 60px 0;border-left:none;border-right:none;border-bottom:none">
      <div class="row" style="justify-content:space-between">
        <div><div class="head" style="font-size:${headSize * 0.78}px">16:52</div><div class="body-l" style="font:600 42px var(--body);color:var(--muted);margin-top:14px">Ankunft · 4 Min · 2,05 km</div></div>
        <div class="btn" style="width:250px;height:140px;background:${theme === 'neon' ? '#ff3b4f' : 'var(--accent)'};color:${theme === 'pixel' ? '#1a1a1a' : '#fff'};border-radius:${theme === 'pixel' ? 6 : 70}px;font:700 46px var(--body)"><span class="body-l">Ende</span></div>
      </div></div>
    <div class="abs" style="right:60px;bottom:420px;font:500 26px Inter;color:${theme === 'western' ? 'rgba(46,30,16,.75)' : 'rgba(255,255,255,.7)'}">© OpenStreetMap-Mitwirkende</div>
  </div>`;
}
function phonePreview() {
  const headSize = theme === 'pixel' ? 80 : theme === 'western' ? 100 : 130;
  return `<div class="screen phone t-${theme}" style="background-image:${bg('phone-preview-' + theme)}">${statusBar()}
    <div class="abs panel row" style="top:177px;left:48px;right:48px;height:140px;padding:0 40px;gap:24px;font:600 42px var(--body)">
      ${ic('back', 56)}<span class="body-l">Mein Standort → <b>Hexenturm</b></span></div>
    <div class="abs panel" style="left:0;right:0;bottom:0;padding:50px 48px 140px;border-left:none;border-right:none;border-bottom:none">
      <div class="head" style="font-size:${headSize}px">Hexenturm</div>
      <div class="body-l" style="font:500 40px var(--body);color:var(--muted);margin:${theme === 'pixel' ? 30 : 12}px 0 36px">Am Hexenturm, 65510 Idstein</div>
      <div class="menu">
        <div class="item sel"><span>Schnellste<small>über Limburger Str. · 3,3 km</small></span><span class="head" style="font-size:${headSize * 0.55}px;text-shadow:none">7 Min</span></div>
        <div class="item"><span>Kürzeste<small>2,9 km</small></span><span>8 Min</span></div>
        <div class="item"><span>Neues entdecken<small style="color:var(--ok)">+14 % Idstein-Mitte</small></span><span>11 Min</span></div>
      </div>
      <div class="row" style="gap:28px;margin-top:44px">
        <div class="btn" style="flex:1;height:180px;background:var(--accent);color:${theme === 'pixel' ? '#1a1a1a' : '#fff'};border-radius:${theme === 'neon' ? 0 : theme === 'pixel' ? 6 : 24}px"><span class="head" style="font-size:${headSize * 0.8}px;text-shadow:none">Los</span></div>
        ${roundBtn('more', 180)}</div>
    </div></div>`;
}

const S = {
  'phone-home': () => `<div class="screen phone t-neon" style="background-image:${bg('phone-home')}">${statusBar()}
    <div class="abs panel row" style="top:177px;left:48px;right:48px;height:156px;padding:0 44px;gap:30px;border-left:18px solid var(--accent)">
      ${ic('search', 64)}<span class="head" style="font-size:90px">Wohin?</span><span style="margin-left:auto;color:var(--muted)">${ic('mic', 60)}</span></div>
    <div class="abs row" style="top:363px;left:48px;gap:20px">
      ${[['home', 'Zuhause', '#fff'], ['work', 'Arbeit', '#fff'], ['fuel', 'Tanken', '#f08a2c'], ['parking', 'Parken', '#5fb6ff']].map(([i, t, c]) => `<span class="panel row chip"><span style="color:${c}">${ic(i, 44)}</span>${t}</span>`).join('')}</div>
    <div class="abs" style="right:48px;top:520px;display:flex;flex-direction:column;gap:24px">${roundBtn('layers')}${roundBtn('friends')}${roundBtn('locate')}</div>
    <div class="abs panel" style="left:48px;right:48px;bottom:290px;padding:40px 46px">
      <div class="row" style="justify-content:space-between"><span class="upper" style="font:700 42px Inter">Idstein-Mitte</span><span class="head" style="font-size:90px">64%</span></div>
      <div class="bar" style="margin:24px 0 20px"><i style="width:64%;background:var(--ok)"></i></div>
      <div style="font:500 36px Inter;color:var(--muted)">entdeckt · noch 11 Straßen bis „Altstadt-Kenner“</div></div>
    ${tabs('Karte')}</div>`,

  'phone-search': () => `<div class="screen phone t-neon" style="background-image:${bg('phone-home')}">
    <div class="abs" style="inset:0;background:rgba(10,10,12,0.74)"></div>${statusBar()}
    <div class="abs" style="top:177px;left:48px;right:48px">
      <div class="row" style="height:156px;padding:0 44px;gap:30px;border-left:18px solid var(--accent);background:#fff;color:#000">${ic('search', 64)}<span style="font:600 58px Inter">Hexen<span style="color:var(--accent)">|</span></span><span style="margin-left:auto;color:#888">${ic('close', 52)}</span></div>
      <div class="menu panel" style="margin-top:44px">
        <div class="title head">Treffer</div>
        <div class="item sel"><span class="row" style="gap:32px"><span style="color:#d9a400">${ic('star', 64)}</span><span>Hexenturm<small>Sehenswürdigkeit · 2,1 km</small></span></span>${ic('chevron', 48)}</div>
        <div class="item"><span class="row" style="gap:32px"><span style="color:#7ee06a">${ic('food', 64)}</span><span>Café am Hexenturm<small>Café · 2,0 km</small></span></span>${ic('chevron', 48)}</div>
        <div class="item"><span class="row" style="gap:32px"><span style="color:#5fb6ff">${ic('parking', 64)}</span><span>Parkplatz Hexenturm<small>Parken · 1,9 km</small></span></span>${ic('chevron', 48)}</div>
      </div>
      <div class="menu panel" style="margin-top:44px">
        <div class="title head" style="background:#2a2a2c">Zuletzt</div>
        <div class="item"><span class="row" style="gap:32px">${ic('home', 64)}<span>Zuhause<small>Lanaer Straße · 3,3 km</small></span></span>${ic('chevron', 48)}</div>
        <div class="item"><span class="row" style="gap:32px"><span style="color:#f08a2c">${ic('fuel', 64)}</span><span>Tankstelle Wiesbadener Str.<small>Tanken · 0,4 km</small></span></span>${ic('chevron', 48)}</div>

function dock() {
  return `<div class="dock"><div>16:48</div><div class="app btn" style="background:linear-gradient(135deg,#a13df0,#3a1066);font:56px Pricedown;color:#fff">Ez</div><div class="app" style="background:#1db954"></div><div class="app" style="background:#2fb94a"></div><div style="margin-top:auto;width:70px;height:70px;border-radius:16px;background:#333"></div></div>`;
}
const tag = (x, y, t) => `<div class="tag" style="left:${x}px;top:${y}px">${t}</div>`;
function carNav() {
  const headSize = theme === 'pixel' ? 36 : theme === 'western' ? 46 : 60;

    <div class="abs" style="right:20px;top:160px;display:flex;flex-direction:column;gap:16px">${['plus', 'minus', 'locate'].map(t => `<div class="sysbtn" style="width:96px;height:96px">${ic(t, 44)}</div>`).join('')}</div>
    <div class="abs" style="left:24px;bottom:26px;color:var(--fg)">
      <div class="panel upper" style="display:inline-block;padding:10px 22px;font:700 30px var(--body)"><span class="body-l">Wiesbadener Straße</span></div>
      <div class="row" style="gap:14px;margin-top:14px"><span class="head" style="font-size:${headSize}px;color:${theme === 'western' ? 'var(--fg)' : '#fff'}">↑ 230 m</span>
        <div class="bar" style="width:240px;height:16px"><i style="width:38%;background:var(--ok)"></i></div><div class="bar" style="width:130px;height:16px"><i style="width:70%;background:var(--accent2)"></i></div></div></div>
    <div class="abs" style="right:170px;bottom:30px;width:124px;height:124px;border-radius:50%;background:#fff;border:15px solid #e3001b;display:grid;place-items:center;font:800 52px Inter;color:#111">50</div>
    <div class="abs" style="right:24px;bottom:12px;font:500 20px Inter;color:${theme === 'western' ? 'rgba(46,30,16,.75)' : 'rgba(255,255,255,.6)'}">© OpenStreetMap-Mitwirkende</div>
    ${tag(24, 410, 'Abbiegekarte & Tasten: CarPlay-System')}</div></div>`;
}
let html;
if (screen.startsWith('phone-nav-')) html = phoneNav();
else if (screen.startsWith('phone-preview-')) html = phonePreview();
else if (screen.startsWith('car-nav-')) html = carNav();
else html = S[screen]();
document.getElementById('root').innerHTML = html;
Promise.all(['40px Pricedown', '40px Rye', "40px 'Press Start 2P'", '40px VT323', '600 40px Inter', '700 40px Inter', '800 40px Inter', '500 40px Inter'].map(f => document.fonts.load(f)))
  .then(() => { if (theme === 'pixel') document.querySelectorAll('.body-l').forEach(e => e.style.fontSize = parseFloat(getComputedStyle(e).fontSize) * 1.35 + 'px'); })
  .then(() => theme === 'pixel' ? pixelize() : null)
  .then(() => setTimeout(() => document.title = 'ready', 300))
  .catch(e => document.title = 'error: ' + e);
</script>
</body>
