name: EzMaps
options:
  bundleIdPrefix: com.game
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de

packages:
  EzMapsCore:
    path: Core
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0  # GM-018: stabil; main der Distribution zeigt schon auf 7.0-Vorabversionen

targets:
  EzMaps:
    type: application
    platform: iOS
    sources:
      - path: App
      # GM-028: Kartenschrift (Barlow Condensed, OFL) als Ordner im App-Bundle – Stil lädt asset://Glyphs/…
      - path: Resources/Glyphs
        type: folder
        buildPhase: resources
    dependencies:
      - package: EzMapsCore
      - package: MapLibre
        product: MapLibre
      - sdk: CarPlay.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.game.ezmaps
        MARKETING_VERSION: "1.0.0"  # GM-020: erste Version für den App Store
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 8L66DP544P
        CODE_SIGN_STYLE: Automatic
        # GM-020: CarPlay-Navi-Berechtigung nur im Simulator – auf dem iPhone erst, wenn Apple sie erteilt hat (sonst scheitert das Signieren)
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/EzMaps.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: EzMaps
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en]
        UILaunchScreen:  # GM-021: Start in Neon-Grundfarbe statt weißem Blitz
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio]
        ITSAppUsesNonExemptEncryption: false  # GM-020: nur HTTPS (Ausnahme) – keine Export-Fragen bei jedem Upload
        # GM-020: Server-Adressen – vor dem Start auf eigene Server umstellen (docs/VEROEFFENTLICHUNG.md)
        EZValhallaURL: "https://valhalla1.openstreetmap.de"
        EZPhotonURL: "https://photon.komoot.io"
        EZLegalURL: "https://jonas-ell.github.io/ezmaps/legal/"
        NSLocationWhenInUseUsageDescription: "EzMaps braucht deinen Standort, um dich zu navigieren und die Karte aufzudecken."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Damit die Navigation weiterläuft, wenn die App im Hintergrund ist."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
